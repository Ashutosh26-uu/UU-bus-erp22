<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Board your bus · United University</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f4c87">
  <link rel="icon" href="/img/uu-crest.png" type="image/png">
  <script src="/js/boot.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="splash" id="splash" role="presentation"><img src="/img/uu-logo.png" alt="United University, Prayagraj" width="320" height="98"><div class="tag">Bus Boarding</div><div class="bar"><i></i></div></div>
  <main class="checkin">
    <header class="row between">
      <img class="logo" src="/img/uu-logo.png" alt="United University, Prayagraj" width="124" height="38">
      <button class="btn icon ghost" id="themeBtn" aria-label="Switch light or dark"></button>
    </header>
    <div id="banner" class="bus-banner hidden"></div>
    <section id="view" class="stack" aria-live="polite"></section>
  </main>
  <script type="module" src="/js/checkin.js"></script>
</body>
</html>
