<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in · UU Bus ERP</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="auth">
    <div class="card pad-lg">
      <div class="brand">
        <img src="/icons/logo.svg" alt="">
        <div>UU Bus ERP<span class="sub">STAFF SIGN IN</span></div>
      </div>
      <form id="loginForm" class="stack" autocomplete="on">
        <div class="field">
          <label for="username">Username</label>
          <input class="input lg" id="username" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input class="input lg" id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="btn icon" type="button" id="togglePw" aria-label="Show password"></button>
          </div>
        </div>
        <div class="error-text" data-error hidden></div>
        <button class="btn primary lg block" type="submit">Sign in</button>
        <p class="help center">Students do not sign in — just scan the QR on the bus screen.</p>
      </form>
    </div>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
